[project]
name = "khatt"
version = "0.2.0"
description = "Render Arabic text as ASCII/Unicode-block art — the Arabic FIGlet"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Essam", email = "mohammedessam613@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "arabic",
    "ascii-art",
    "figlet",
    "rtl",
    "harfbuzz",
    "text-art",
    "unicode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "freetype-py>=2.5.1",
    "pillow>=10.1.0",
    "python-bidi>=0.6.11",
    "typer>=0.15.4",
    "uharfbuzz>=0.55.0",
]

[project.scripts]
khatt = "khatt.cli:app"

[project.urls]
Homepage = "https://github.com/DrEssam97/khatt"
Repository = "https://github.com/DrEssam97/khatt"
Issues = "https://github.com/DrEssam97/khatt/issues"
Changelog = "https://github.com/DrEssam97/khatt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = [
    "gradio>=6.20.0",
]
video = [
    "moviepy>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khatt"]

[dependency-groups]
# The newest Pillow, which moviepy (the video extra) holds below 12: see
# [tool.uv] below.
latest-pillow = [
    "pillow>=12.3.0",
]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "twine>=7.0.0",
]

[tool.uv]
# moviepy requires pillow<12, and uv locks one Pillow for every extra unless
# told otherwise, so the video extra would hold all of development back at
# Pillow 11. Declaring it in conflict with the latest-pillow group (on by
# default) locks both: `uv sync` gets the newest Pillow, and
# `uv sync --extra video --no-group latest-pillow` gets moviepy.
default-groups = ["dev", "latest-pillow"]
conflicts = [[{ extra = "video" }, { group = "latest-pillow" }]]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# Arabic text appears throughout this codebase by design; the "ambiguous
# unicode character" rules would flag every Arabic string literal.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI parameters via calls in argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
# No python_version pin: numpy (a transitive dependency of the optional
# gradio extra) ships stubs using py3.12+ `type` statements that hard-fail
# mypy's py3.10 mode via Pillow's TYPE_CHECKING imports. Compatibility with
# Python 3.10 is guarded by the CI test matrix instead.
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=khatt --cov-report=term-missing --cov-fail-under=85"
