name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, e.g. "fit a caption into a fixed box in a video".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like khatt to do?
      description: The API or CLI option you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds or other libraries you've looked at.
