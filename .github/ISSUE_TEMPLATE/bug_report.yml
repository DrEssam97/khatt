name: Bug report
description: Text drawn wrong, an error, or anything else that doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead. A screenshot helps for rendering bugs.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code to reproduce
      description: The smallest snippet or command that shows the problem, including the exact text.
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `khatt --doctor`
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
    validations:
      required: true
