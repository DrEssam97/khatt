name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy khatt

      - name: Tests (pytest + coverage)
        run: uv run pytest

  font-pack:
    # khatt-fonts isn't part of the default environment, whose tests expect the
    # bundled fonts only. --no-deps: it requires a khatt from PyPI, and this
    # job tests it with the khatt in this checkout.
    name: font pack / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies with the font pack
        run: |
          uv sync --locked
          uv pip install --no-deps ./packages/khatt-fonts

      - name: Tests (pytest)
        run: uv run --no-sync pytest tests/test_font_pack.py --no-cov

  raqm:
    # Pillow can shape text itself through Raqm when FriBiDi is installed, as
    # in many Linux images. khatt must draw exactly the same either way, and
    # must never shape twice, so the whole suite also runs with Raqm on.
    name: Pillow with Raqm / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install FriBiDi, which Pillow's Raqm needs
        run: sudo apt-get update && sudo apt-get install -y libfribidi0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run --no-sync python -c "from PIL import features; assert features.check('raqm'), 'Raqm did not load'; print('Raqm', features.version('raqm'))"

      - name: Tests (pytest)
        run: uv run --no-sync pytest

  compat:
    # The lockfile always tests the newest dependencies. These jobs prove khatt
    # still works at its declared minimums, and next to the exact pins of
    # MoneyPrinterTurbo (moviepy 2.2.1 holds it at Pillow 11.3.0).
    name: ${{ matrix.name }} / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum versions
            os: ubuntu-latest
            python-version: "3.11"
            pins: pillow==10.1.0 typer==0.15.4
          - name: MoneyPrinterTurbo pins
            os: ubuntu-latest
            python-version: "3.11"
            pins: pillow==11.3.0 typer==0.26.5
          - name: MoneyPrinterTurbo pins
            os: windows-latest
            python-version: "3.11"
            pins: pillow==11.3.0 typer==0.26.5
          - name: MoneyPrinterTurbo pins
            os: ubuntu-latest
            python-version: "3.13"
            pins: pillow==11.3.0 typer==0.26.5
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies, then the pinned versions
        run: |
          uv sync --locked
          uv pip install ${{ matrix.pins }}
          uv run --no-sync python -c "import PIL, typer; print('Pillow', PIL.__version__, '| typer', typer.__version__)"

      - name: Tests (pytest)
        run: uv run --no-sync pytest

  video:
    # moviepy (the video extra) holds Pillow below 12, so the lockfile keeps
    # a separate resolution for it: see [tool.uv] in pyproject.toml.
    name: video extra / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with the video extra
        run: |
          uv sync --locked --extra video --no-group latest-pillow
          uv run --no-sync python -c "import PIL, moviepy; print('Pillow', PIL.__version__)"

      - name: Tests (pytest)
        run: uv run --no-sync pytest
